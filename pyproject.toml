[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "zeo-creator"
version = "0.1.0"
description = "Provider-neutral creator operations capabilities built on Zeocore"
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
authors = [{ name = "Zero Employee" }]
dependencies = [
  "zeocore==0.6.0",
  "pydantic>=2.6.0",
  "rich>=13.8.0",
  "typer>=0.27.1",
]

[project.urls]
Homepage = "https://github.com/profrodai/zeocreator"
Repository = "https://github.com/profrodai/zeocreator"

[project.scripts]
zeo-creator = "zeo_creator.cli:main"

[dependency-groups]
dev = [
  "pytest>=7.0.0",
  "pytest-cov>=4.1.0",
  "ruff>=0.2.0",
  "mypy>=1.18.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/zeo_creator"]

[tool.uv]
default-groups = ["dev"]
package = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "RUF"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.14"
strict = true
files = ["src/zeo_creator"]
