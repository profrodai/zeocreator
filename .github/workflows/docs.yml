name: Documentation

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "examples/**"
      - "src/**"
      - "mkdocs.yml"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: documentation
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.14"

      - name: Sync locked environment
        run: uv sync --frozen

      - name: Build documentation strictly
        run: uv run mkdocs build --strict

      - name: Publish generated site branch
        run: uv run mkdocs gh-deploy --force
