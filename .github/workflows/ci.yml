name: Verify

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.14"]

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      - name: Sync dependencies
        run: uv sync --frozen

      - name: Verify
        run: make verify

      - name: Agent check
        run: make doctor

      - name: CLI smoke test
        run: make version && make capabilities && make help

      - name: Install and smoke-test the built wheel outside the source tree
        shell: bash
        run: |
          uv venv --python 3.14 .wheel-smoke
          uv pip install --python .wheel-smoke/bin/python dist/*.whl
          smoke_dir="$(mktemp -d)"
          cd "$smoke_dir"
          "$GITHUB_WORKSPACE/.wheel-smoke/bin/python" -c "from zeo_creator.registry import capability_manifests; assert len(capability_manifests()) == 6"
          "$GITHUB_WORKSPACE/.wheel-smoke/bin/zeo-creator" doctor --json
          "$GITHUB_WORKSPACE/.wheel-smoke/bin/zeo-creator" contracts list --json
          "$GITHUB_WORKSPACE/.wheel-smoke/bin/zeo-creator" contract-schema --name=content-brief --version=1
          "$GITHUB_WORKSPACE/.wheel-smoke/bin/zeo-creator" contracts export --output="$smoke_dir/schemas"
          test -f "$smoke_dir/schemas/artifact-manifest.v1.schema.json"
