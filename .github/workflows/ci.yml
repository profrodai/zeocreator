name: Verify

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.14"]

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      - name: Sync dependencies
        run: uv sync --frozen

      - name: Verify
        run: make verify

      - name: Agent check
        run: make doctor

      - name: CLI smoke test
        run: make version && make capabilities && make help

      - name: Install and smoke-test the built wheel outside the source tree
        shell: bash
        run: |
          uv venv --python 3.14 .wheel-smoke
          uv pip install --python .wheel-smoke/bin/python dist/*.whl
          smoke_dir="$(mktemp -d)"
          cd "$smoke_dir"
          "$GITHUB_WORKSPACE/.wheel-smoke/bin/python" -c "from zeo_creator.registry import capability_manifests; assert len(capability_manifests()) == 6"
          "$GITHUB_WORKSPACE/.wheel-smoke/bin/zeo-creator" doctor --json
